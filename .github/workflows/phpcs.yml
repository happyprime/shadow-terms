# Run PHP Code Sniffer (PHPCS) and comment on the pull request with any issues.
#
# This file is managed in https://github.com/happyprime/projects
name: PHPCS (Default, PHP 8.3)

on:
  pull_request:
    # A change to another workflow file is no reason to run this one.
    paths:
      - '**'
      - '!.github/workflows/**'
      - .github/workflows/phpcs.yml

# Cancel a run that a newer push to the same pull request has superseded.
# GitHub bills per job by wall-clock time rounded up to the minute, so a run
# nobody is waiting on still costs full price.
#
# `cancel-in-progress` is conditional rather than `true`: these workflows also
# run on pushes to trunk in some projects, and a trunk run is the record of
# what is on the default branch. Only pull request runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The GITHUB_TOKEN used by Dependabot has read-only permissions by default. We
# provide write permissions to this workflow so that comments can be left on
# the pull request.
#
# @see https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#changing-github_token-permissions
permissions:
  contents: read
  pull-requests: write

jobs:
  call-workflow:
    uses: happyprime/workflows/.github/workflows/phpcs.yml@trunk
    with:
      php-version: '8.3'
